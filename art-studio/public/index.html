<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 1rem; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; margin-bottom: 1rem; }
    nav button { margin-right: .25rem; }
    nav button.active { font-weight: bold; text-decoration: underline; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: .6rem .8rem; margin: .5rem 0; }
    .muted { color: #777; } .error { color: #b00020; } .ok { color: #0a7d33; }
    label { display: block; margin: .4rem 0; } input, select, textarea { margin-left: .3rem; }
    .tag { font-size: .8em; padding: 0 .4em; border-radius: 4px; background: #eee; }
  </style>
</head>
<body>
  <header><h1>Art Studio</h1><div id="who"></div></header>
  <nav id="nav"></nav>
  <p id="msg" role="status"></p>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
